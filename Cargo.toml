# Virtual workspace: the server, the CLI, and the API types they share. One
# target/ and one Cargo.lock for the whole repo; the React app lives in
# `frontend/` and the Python functional suite in `tests/functional/`.
[workspace]
members = ["crates/parcel-types", "crates/parcel-server", "crates/parcel-cli"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.97"
license = "MIT"
authors = ["Charlie Knudsen"]
repository = "https://github.com/charliek/parcel"

[workspace.dependencies]
parcel-types = { path = "crates/parcel-types" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Cheap debug info in dev (and none for dependencies), as slaudio and imgmcp
# do, so incremental builds and the target dir stay small.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
