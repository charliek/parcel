# Local infrastructure for parcel. Ports are chosen to avoid every sibling
# StrideLabs project (see PLAN.md "Environments and domains").
services:
  postgres:
    image: postgres:16-alpine
    container_name: parcel-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: parcel
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # GCS emulator: exercises the production blob-store code path locally.
  # In-memory, so tests create the buckets they use (see tests/gcs.rs).
  fake-gcs:
    image: fsouza/fake-gcs-server:1.52
    container_name: parcel-fake-gcs
    command: -scheme http -port 4447 -backend memory -public-host localhost:4447
    ports:
      - "127.0.0.1:4447:4447"

volumes:
  postgres_data:
