[package]
name = "parcel-cli"
description = "Command-line client for Parcel: publish and read HTML artifacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "parcel"
path = "src/main.rs"

# Debian packaging (cargo-deb), the strix pattern. The Debian package is named
# `parcel` (not the crate name) and installs the binary at /usr/bin/parcel.
# `revision = ""` drops cargo-deb's default `-1` so the artifact is
# `parcel_<version>_<arch>.deb`, matching the apt-charliek glob. The binary is
# self-contained (rustls, no OpenSSL), so `$auto` resolves to libc only.
[package.metadata.deb]
name = "parcel"
maintainer = "Charlie Knudsen <charlie.knudsen@gmail.com>"
copyright = "2026, Charlie Knudsen <charlie.knudsen@gmail.com>"
depends = "$auto"
section = "utils"
priority = "optional"
revision = ""
extended-description = """\
parcel publishes HTML pages (plus supporting files) to a Parcel server and \
returns a private URL that renders them in a sandbox. It also lists, reads, \
updates and deletes parcels, and installs the bundled agent skill for Claude \
Code, craze and opencode."""

[dependencies]
parcel-types = { workspace = true }
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6"
gethostname = "1"
open = "5"
# Blocking client. reqwest runs a private tokio runtime on a background thread
# for this; nothing else in the CLI is async. Both root sources: 0.13's
# `rustls` verifies with the platform verifier (the OS trust store, so a local
# mkcert CA for parcel.local.stridelabs.ai and corporate roots are trusted),
# and `client.rs` merges in Mozilla's roots (`webpki-root-certs`) as a
# predictable baseline for a machine or container with no CA bundle.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "multipart",
    "rustls",
] }
webpki-root-certs = "1"
serde = { version = "1", features = ["derive"] }
# raw_value: data values are printed with the server's key order, not re-sorted.
serde_json = { version = "1", features = ["raw_value"] }
# Pretty-prints the API's JSON without reordering keys (`--json`), which
# serde_json::Value would do unless `preserve_order` were enabled workspace-wide.
serde-transcode = "1"
time = "0.3"
toml = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6"
