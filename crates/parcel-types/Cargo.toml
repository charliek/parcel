[package]
name = "parcel-types"
description = "Wire types and validation rules shared by the parcel server, CLI and tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# utoipa `ToSchema` derives for the server's OpenAPI document. Off by default
# so the CLI's dependency graph never compiles utoipa.
openapi = ["dep:utoipa"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "serde-well-known"] }
thiserror = "2"
utoipa = { version = "6", features = ["time"], optional = true }
