[package]
name = "parcel-server"
description = "Parcel: publish HTML artifacts to private, sandboxed URLs"
default-run = "parcel-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "parcel_server"
path = "src/lib.rs"

[[bin]]
name = "parcel-server"
path = "src/main.rs"

[features]
# Swagger UI at `/docs`, additionally gated at runtime on APP_ENV != production
# (the slauth pattern). `--no-default-features` removes every reference to
# utoipa-swagger-ui, which is how the production image is built.
# `/openapi.json` itself is plain utoipa wiring and is served in every build.
default = ["swagger-ui"]
swagger-ui = ["dep:utoipa-swagger-ui"]

[dependencies]
parcel-types = { workspace = true, features = ["openapi"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP server
axum = { version = "0.8", features = ["multipart"] }
tower = { version = "0.5", features = ["util", "steer"] }
# 0.7's ServeDir (spa.rs) sends strong ETags and answers If-None-Match with
# 304, and 404s a trailing slash on a file path (the SPA fallback then serves
# index.html); tests/spa.rs pins what the mount answers.
tower-http = { version = "0.7", features = ["trace", "fs", "set-header", "limit"] }
http-body-util = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Outbound HTTP (OIDC discovery/token/userinfo, JWKS via stridelabs-auth,
# GCS JSON API, Google OAuth). 0.13's `rustls` replaces 0.12's `rustls-tls`
# (bundled roots) and `rustls-tls-native-roots`: rustls on aws-lc-rs with the
# platform verifier, i.e. the OS trust store, which holds the public roots
# (the image's CA bundle) and a local mkcert CA (prox) alike. `form` is
# opt-in since 0.13 (the token-endpoint posts).
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "form",
    "rustls",
] }
bytes = "1"
url = "2"
percent-encoding = "2"

# Database
# `tls-rustls-aws-lc-rs`, never a `ring` flavour: rustls must have exactly
# one crypto provider (aws-lc-rs, as reqwest's `rustls` brings), or a
# `ClientConfig::builder()` relying on the crate-feature default panics.
# Server certificates verify against the bundled webpki roots
# (`sslmode=verify-full` in production).
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-aws-lc-rs",
    "postgres",
    "uuid",
    "time",
    "migrate",
    "macros",
] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

# Crypto: content-token HMAC, blob hashing, device codes, GCS service-account JWT
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
rand = "0.10"
base64 = "0.22"
hex = "0.4"
# Exactly ONE crypto backend, `aws_lc_rs` (what stridelabs-auth turns on):
# jsonwebtoken 10+ picks it from crate features unified over the whole graph
# and panics at the first sign or verify with none or two. Never enable
# `rust_crypto` (it signs through the `rsa` crate, RUSTSEC-2023-0071).
# `use_pem` gives `EncodingKey::from_rsa_pem` for the GCS service-account key.
jsonwebtoken = { version = "11", default-features = false, features = [
    "aws_lc_rs",
    "use_pem",
] }

# Content serving
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
moka = { version = "0.12", features = ["future"] }

# Observability
tracing = "0.1"

# CLI / errors / config
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
dotenvy = "0.15"
async-trait = "0.1"

# OpenAPI: utoipa-axum's OpenApiRouter for every documented /api/v1 route; the
# committed spec is checked by tests/openapi_shape.rs. utoipa 6 is the major
# stridelabs-http's `openapi` helpers take; utoipa-axum 0.3 is the release
# for it.
utoipa = { version = "6", features = ["uuid", "time"] }
utoipa-axum = "0.3"
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"], optional = true }

# StrideLabs shared crates (public git dep, lockstep-versioned).
stridelabs-config = { git = "https://github.com/charliek/stridelabs-rust.git", tag = "v0.5.0" }
stridelabs-observability = { git = "https://github.com/charliek/stridelabs-rust.git", tag = "v0.5.0" }
stridelabs-http = { git = "https://github.com/charliek/stridelabs-rust.git", tag = "v0.5.0", features = ["openapi"] }
stridelabs-auth = { git = "https://github.com/charliek/stridelabs-rust.git", tag = "v0.5.0", features = ["axum", "http"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
tempfile = "3"
stridelabs-testing = { git = "https://github.com/charliek/stridelabs-rust.git", tag = "v0.5.0", features = ["postgres"] }
stridelabs-auth = { git = "https://github.com/charliek/stridelabs-rust.git", tag = "v0.5.0", features = ["test-support"] }
