name: Release (server image)

# Builds and pushes the parcel-server image on date tags (vYYYY.MM.DD[.N]),
# the fleet's /deploy:build convention. CLI releases use semver tags and
# release-cli.yml. Not yet exercised: no date tag has been pushed.

on:
  push:
    tags: ["v2[0-9][0-9][0-9].*"]

permissions:
  contents: read
  id-token: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}
          token_format: access_token
      - uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/stridelabs/parcel
          tags: |
            type=raw,value={{date 'YYYY.MM.DD'}}-{{sha}}
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
