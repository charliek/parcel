name: CI

# Not yet exercised: the repo is not on GitHub yet. Mirrors `make check`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: parcel
        ports: ["5439:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Start fake-gcs-server
        run: docker run -d --name fake-gcs -p 4447:4447 fsouza/fake-gcs-server:1.52 -scheme http -port 4447 -backend memory -public-host localhost:4447
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy (production feature set)
        run: cargo clippy -p parcel-server --no-default-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Doc
        run: cargo doc --workspace --all-features --no-deps --locked
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Lint openapi.json (Spectral)
        run: bunx @stoplight/spectral-cli@6.16.2 lint crates/parcel-server/openapi.json --fail-severity=warn
      - uses: astral-sh/setup-uv@v6
      - name: Functional tests (real binaries over HTTP)
        run: uv run --locked --group test pytest tests/functional

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc -b
      - run: bun test
      - run: bun run build

  ci-success:
    needs: [rust, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed
        run: |
          for r in "${{ needs.rust.result }}" "${{ needs.frontend.result }}"; do
            if [ "$r" != "success" ]; then echo "::error::a CI job did not succeed ($r)"; exit 1; fi
          done
