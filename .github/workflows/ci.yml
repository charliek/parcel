name: CI

# Mirrors `make check`, plus the Playwright suite and a production image build.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The same compose stack as local: the functional suite resets its
      # database through `docker exec parcel-postgres`.
      - name: Start Postgres and the GCS emulator
        run: docker compose up -d --wait postgres fake-gcs
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy (production feature set)
        run: cargo clippy -p parcel-server --no-default-features --locked -- -D warnings
      # Prebuilt binary, pinned: a cargo-deny release can't turn CI red by itself.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny (advisories, licenses, bans, sources)
        run: cargo deny --locked check
      - name: "Guard: no ring or rsa in the graph"
        run: scripts/crypto-guard.sh
      - name: Test
        run: cargo test --workspace --locked
      - name: Test pools keep their search_path with DATABASE_URL set
        env:
          DATABASE_URL: postgres://postgres:localdev@localhost:5439/parcel_test
        run: cargo test -p parcel-server --locked --test migrations test_pools_keep_their_own_search_path
      - name: Doc
        run: cargo doc --workspace --all-features --no-deps --locked
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Lint openapi.json (Spectral)
        run: bunx @stoplight/spectral-cli@6.16.2 lint crates/parcel-server/openapi.json --fail-severity=warn
      - uses: astral-sh/setup-uv@v6
      - name: Functional tests (real binaries over HTTP)
        run: uv run --locked --group test pytest tests/functional

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc -b
      - run: bun test
      - run: bun run build

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Compose, not a service container: scripts/e2e-stack.sh resets its
      # database through `docker exec parcel-postgres`.
      - name: Start Postgres
        run: docker compose up -d --wait postgres
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: "1.97.1"
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: bun install --frozen-lockfile && bunx playwright install --with-deps chromium
      - name: Start the e2e stack (built SPA, dev auth)
        run: |
          scripts/e2e-stack.sh > e2e-stack.log 2>&1 &
          for _ in $(seq 1 300); do
            curl -fsS http://localhost:18110/health/live >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat e2e-stack.log; exit 1
      - name: Playwright
        working-directory: frontend
        env:
          PARCEL_E2E_BASE_URL: http://localhost:18110
        run: bun run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            e2e-stack.log
          retention-days: 7

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the production image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-success:
    needs: [rust, frontend, e2e, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed
        run: |
          for r in "${{ needs.rust.result }}" "${{ needs.frontend.result }}" "${{ needs.e2e.result }}" "${{ needs.image.result }}"; do
            if [ "$r" != "success" ]; then echo "::error::a CI job did not succeed ($r)"; exit 1; fi
          done
